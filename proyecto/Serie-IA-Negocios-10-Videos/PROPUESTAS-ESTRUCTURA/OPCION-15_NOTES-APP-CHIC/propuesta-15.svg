  <svg x="301" y="270" width="486" height="864" viewBox="0 0 486 864" overflow="hidden"><rect width="486" height="864" fill="#fff7c8"/><rect width="486" height="864" fill="url(#paperLines)"/><text x="42" y="78" font-family="Arial" font-size="20" font-weight="800" fill="#9c7b12">HOY</text><text x="42" y="181" font-family="Georgia" font-size="51" font-weight="700" fill="#24211d">ANOTA ESTO</text><text x="42" y="240" font-family="Georgia" font-size="51" font-weight="700" fill="#24211d">ANTES DE</text><text x="42" y="299" font-family="Georgia" font-size="51" font-weight="700" fill="#d94c43">PUBLICAR:</text><path d="M43 345 C172 321 295 379 440 343" fill="none" stroke="#d94c43" stroke-width="9"/><text x="64" y="456" font-family="Comic Sans MS, cursive" font-size="34" fill="#24211d">¿Esto lo podría decir</text><text x="64" y="505" font-family="Comic Sans MS, cursive" font-size="34" fill="#24211d">cualquier persona?</text><rect x="51" y="628" width="384" height="118" fill="#f0b61a" transform="rotate(-2 243 687)"/><text x="243" y="678" text-anchor="middle" font-family="Arial Black" font-size="27" fill="#24211d">SI LA RESPUESTA ES SÍ,</text><text x="243" y="719" text-anchor="middle" font-family="Arial Black" font-size="27" fill="#24211d">TODAVÍA FALTA ALGO.</text></svg>
