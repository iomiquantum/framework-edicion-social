<rect x="829" y="270" width="486" height="864" rx="0" fill="#e7eef8" filter="url(#shadow)"/><svg x="829" y="270" width="486" height="864" viewBox="0 0 486 864" overflow="hidden"><rect x="0" y="0" width="486" height="864" rx="0" fill="#e7eef8"/><text x="42" y="108" font-family="Arial, sans-serif" font-size="45" fill="#142745" font-weight="900">DI EL DATO</text><text x="42" y="161" font-family="Arial, sans-serif" font-size="45" fill="#7846a8" font-weight="900">EN VOZ ALTA.</text><rect x="42" y="232" width="402" height="182" rx="22" fill="#142745"/><text x="70" y="286" font-family="Arial, sans-serif" font-size="20" fill="#8fd1df" font-weight="900" letter-spacing="3">EN AUDIO:</text><text x="70" y="339" font-family="Arial, sans-serif" font-size="31" fill="#ffffff" font-weight="900">“COMPRÉ CINCO</text><text x="70" y="381" font-family="Arial, sans-serif" font-size="31" fill="#ffffff" font-weight="900">CURSOS.”</text><path d="M51 564 H82 L99 516 L125 614 L153 540 L182 590 L212 513 L244 614 L277 539 L309 589 L342 520 L369 564 H436" fill="none" stroke="#1d6d82" stroke-width="9" stroke-linejoin="round"/><text x="243" y="720" font-family="Arial, sans-serif" font-size="26" fill="#142745" text-anchor="middle" font-weight="900">EL NÚMERO SE VE</text><text x="243" y="759" font-family="Arial, sans-serif" font-size="26" fill="#7846a8" text-anchor="middle" font-weight="900">Y SE ESCUCHA.</text></svg>
<rect x="1357" y="270" width="486" height="864" rx="0" fill="#7846a8" filter="url(#shadow)"/><svg x="1357" y="270" width="486" height="864" viewBox="0 0 486 864" overflow="hidden"><image x="0" y="0" width="486" height="864" xlink:href="../assets-compartidos/video-11-collage.png" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="0" width="486" height="864" rx="0" fill="#142745" opacity="0.45"/><rect x="28" y="28" width="430" height="153" rx="24" fill="#e7eef8"/><text x="52" y="78" font-family="Arial, sans-serif" font-size="26" fill="#142745" font-weight="900">DESCRIBE EL CAMBIO</text><text x="52" y="125" font-family="Arial, sans-serif" font-size="25" fill="#7846a8" font-weight="700">“LA PANTALLA PASA</text><text x="52" y="157" font-family="Arial, sans-serif" font-size="25" fill="#7846a8" font-weight="700">DE CINCO A CERO.”</text><rect x="28" y="673" width="430" height="162" rx="24" fill="#142745"/><text x="52" y="728" font-family="Arial, sans-serif" font-size="20" fill="#8fd1df" font-weight="900">NO DIGAS:</text><text x="52" y="776" font-family="Arial, sans-serif" font-size="30" fill="#ffffff" font-weight="900">“COMO VES AQUÍ...”</text><text x="52" y="812" font-family="Arial, sans-serif" font-size="19" fill="#8fd1df" font-weight="700">SIN EXPLICAR QUÉ CAMBIÓ.</text></svg>
<rect x="1885" y="270" width="486" height="864" rx="0" fill="#142745" filter="url(#shadow)"/><svg x="1885" y="270" width="486" height="864" viewBox="0 0 486 864" overflow="hidden"><image x="0" y="0" width="486" height="864" xlink:href="../assets-compartidos/presentador-02.jpg" preserveAspectRatio="xMidYMid slice"/><rect x="0" y="0" width="486" height="864" rx="0" fill="#142745" opacity="0.05"/><rect x="25" y="28" width="436" height="137" rx="22" fill="#142745"/><text x="243" y="80" font-family="Arial, sans-serif" font-size="27" fill="#e7eef8" text-anchor="middle" font-weight="900">DI LO QUE HACES</text><text x="243" y="124" font-family="Arial, sans-serif" font-size="27" fill="#8fd1df" text-anchor="middle" font-weight="900">MIENTRAS LO HACES.</text><rect x="25" y="688" width="436" height="147" rx="22" fill="#e7eef8"/><text x="48" y="739" font-family="Arial, sans-serif" font-size="29" fill="#142745" font-weight="900">“CIERRO EL CURSO</text><text x="48" y="782" font-family="Arial, sans-serif" font-size="27" fill="#7846a8" font-weight="900">Y ABRO MI PROYECTO.”</text></svg>
<rect x="2413" y="270" width="486" height="864" rx="0" fill="#1d6d82" filter="url(#shadow)"/><svg x="2413" y="270" width="486" height="864" viewBox="0 0 486 864" overflow="hidden"><rect x="0" y="0" width="486" height="864" rx="0" fill="#1d6d82"/><circle cx="243" cy="285" r="151" fill="#e7eef8"/><path d="M160 285 H195 L215 224 L247 348 L278 242 L303 322 L329 285 H361" fill="none" stroke="#7846a8" stroke-width="11" stroke-linejoin="round"/><text x="243" y="491" font-family="Arial, sans-serif" font-size="42" fill="#ffffff" text-anchor="middle" font-weight="900">¿SE ENTIENDE</text><text x="243" y="544" font-family="Arial, sans-serif" font-size="42" fill="#d8c3ed" text-anchor="middle" font-weight="900">SIN MIRAR?</text><rect x="54" y="655" width="378" height="104" rx="24" fill="#142745"/><text x="243" y="720" font-family="Arial, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle" font-weight="900">SI SÍ, LA IDEA ESTÁ COMPLETA.</text></svg>
