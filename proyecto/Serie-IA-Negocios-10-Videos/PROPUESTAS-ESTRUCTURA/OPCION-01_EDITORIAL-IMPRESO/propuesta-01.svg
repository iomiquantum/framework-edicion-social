<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="3200" height="3200" viewBox="0 0 3200 3200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#171511" flood-opacity="0.18"/>
    </filter>
    <pattern id="paper" width="26" height="26" patternUnits="userSpaceOnUse">
      <rect width="26" height="26" fill="#eee7db"/>
      <circle cx="3" cy="6" r="0.8" fill="#171511" opacity="0.09"/>
      <circle cx="19" cy="16" r="0.7" fill="#234ddb" opacity="0.08"/>
    </pattern>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.6" fill="#234ddb" opacity="0.28"/>
    </pattern>
    <clipPath id="p1"><rect x="301" y="270" width="486" height="864"/></clipPath>
    <clipPath id="p2"><rect x="829" y="270" width="486" height="864"/></clipPath>
    <clipPath id="p3"><rect x="1357" y="270" width="486" height="864"/></clipPath>
    <clipPath id="p4"><rect x="1885" y="270" width="486" height="864"/></clipPath>
    <clipPath id="p5"><rect x="2413" y="270" width="486" height="864"/></clipPath>
  </defs>

  <rect width="3200" height="3200" fill="url(#paper)"/>
  <path d="M0 225 H3200" stroke="#171511" stroke-width="3"/>
  <text x="150" y="90" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="38" font-weight="700" letter-spacing="8" fill="#234ddb">PROPUESTA 01 · VIDEO 11</text>
  <text x="150" y="168" font-family="Baskerville, Georgia, serif" font-size="62" font-weight="700" fill="#171511">Editorial impreso — una idea que deja marca</text>
  <text x="3020" y="110" text-anchor="end" font-family="Courier New, monospace" font-size="27" font-weight="700" fill="#171511">5 MOMENTOS / 9:16</text>
  <text x="3020" y="155" text-anchor="end" font-family="Courier New, monospace" font-size="22" fill="#171511">BORRADOR VISUAL · SIN ANIMACIÓN</text>

  <!-- FRAME 1 -->
  <g filter="url(#shadow)"><rect x="301" y="270" width="486" height="864" fill="#171511"/></g>
  <g clip-path="url(#p1)">
    <image x="301" y="520" width="486" height="614" xlink:href="../assets-compartidos/presentador-01.jpg" preserveAspectRatio="xMidYMid slice"/>
    <rect x="301" y="270" width="486" height="250" fill="#f5efe4"/>
    <rect x="301" y="270" width="18" height="250" fill="#234ddb"/>
    <text x="342" y="392" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="69" font-weight="700" letter-spacing="-2" fill="#171511">INTERNET</text>
    <text x="342" y="467" font-family="Baskerville, Georgia, serif" font-size="49" font-weight="700" fill="#171511">ya está</text>
    <text x="506" y="467" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="65" font-weight="700" fill="#234ddb">LLENO.</text>
    <rect x="319" y="1025" width="450" height="86" fill="#f5efe4"/>
    <text x="343" y="1082" font-family="Avenir Next, Arial, sans-serif" font-size="21" font-weight="700" fill="#171511">La IA produce cada vez más contenido.</text>
  </g>

  <!-- FRAME 2 -->
  <g filter="url(#shadow)"><rect x="829" y="270" width="486" height="864" fill="#f5efe4"/></g>
  <g clip-path="url(#p2)">
    <rect x="829" y="270" width="486" height="864" fill="#f5efe4"/>
    <rect x="829" y="270" width="486" height="190" fill="url(#dots)"/>
    <text x="872" y="334" font-family="Courier New, monospace" font-size="21" font-weight="700" letter-spacing="3" fill="#234ddb">LA PROMESA DE LA IA</text>
    <text x="872" y="508" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="122" font-weight="700" fill="#171511">MÁS</text>
    <path d="M872 536 H1268" stroke="#234ddb" stroke-width="13"/>
    <text x="872" y="663" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="74" font-weight="700" fill="#171511">MÁS RÁPIDO</text>
    <text x="872" y="784" font-family="Baskerville, Georgia, serif" font-size="76" font-style="italic" font-weight="700" fill="#234ddb">más bonito</text>
    <text x="872" y="918" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="55" font-weight="700" fill="#171511">01  02  03  04  05</text>
    <text x="872" y="970" font-family="Courier New, monospace" font-size="20" fill="#171511">PUBLICAR · REPETIR · ACELERAR</text>
    <rect x="829" y="1042" width="486" height="92" fill="#234ddb"/>
    <text x="1072" y="1098" text-anchor="middle" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="31" font-weight="700" letter-spacing="3" fill="#f5efe4">VOLUMEN ≠ VALOR</text>
  </g>

  <!-- FRAME 3 -->
  <g filter="url(#shadow)"><rect x="1357" y="270" width="486" height="864" fill="#171511"/></g>
  <g clip-path="url(#p3)">
    <image x="1357" y="270" width="486" height="864" xlink:href="../assets-compartidos/video-11-collage.png" preserveAspectRatio="xMidYMid slice"/>
    <rect x="1357" y="270" width="486" height="120" fill="#171511" opacity="0.94"/>
    <text x="1390" y="319" font-family="Courier New, monospace" font-size="19" font-weight="700" letter-spacing="3" fill="#f5efe4">CUANDO TODOS PUEDEN CREAR</text>
    <text x="1390" y="364" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="37" font-weight="700" fill="#f5efe4">LO PROMEDIO SE MULTIPLICA</text>
    <rect x="1605" y="600" width="238" height="370" fill="#f5efe4" opacity="0.96"/>
    <text x="1638" y="662" font-family="Courier New, monospace" font-size="19" font-weight="700" fill="#234ddb">RESULTADO</text>
    <text x="1638" y="747" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="52" font-weight="700" fill="#171511">MÁS</text>
    <text x="1638" y="805" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="52" font-weight="700" fill="#171511">RUIDO</text>
    <path d="M1640 844 H1808" stroke="#234ddb" stroke-width="10"/>
    <text x="1638" y="916" font-family="Baskerville, Georgia, serif" font-size="29" font-style="italic" font-weight="700" fill="#234ddb">menos señal</text>
    <rect x="1375" y="1040" width="450" height="72" fill="#171511" opacity="0.92"/>
    <text x="1400" y="1085" font-family="Avenir Next, Arial, sans-serif" font-size="21" font-weight="700" fill="#f5efe4">El contenido promedio pierde valor.</text>
  </g>

  <!-- FRAME 4 -->
  <g filter="url(#shadow)"><rect x="1885" y="270" width="486" height="864" fill="#171511"/></g>
  <g clip-path="url(#p4)">
    <image x="1885" y="270" width="486" height="864" xlink:href="../assets-compartidos/presentador-02.jpg" preserveAspectRatio="xMidYMid slice"/>
    <rect x="1885" y="270" width="486" height="210" fill="#234ddb" opacity="0.95"/>
    <text x="1923" y="326" font-family="Courier New, monospace" font-size="19" font-weight="700" letter-spacing="3" fill="#f5efe4">LA DIFERENCIA NO ES PRODUCIR</text>
    <text x="1923" y="398" font-family="Baskerville, Georgia, serif" font-size="62" font-weight="700" fill="#f5efe4">Es tener</text>
    <text x="1923" y="458" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="64" font-weight="700" fill="#f5efe4">ALGO QUE DECIR.</text>
    <rect x="1922" y="876" width="412" height="180" fill="#f5efe4"/>
    <text x="1952" y="934" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="46" font-weight="700" fill="#171511">PRODUCIR MÁS</text>
    <text x="1952" y="998" font-family="Baskerville, Georgia, serif" font-size="52" font-style="italic" font-weight="700" fill="#234ddb">no dice más.</text>
    <line x1="1952" y1="1023" x2="2292" y2="1023" stroke="#171511" stroke-width="5"/>
  </g>

  <!-- FRAME 5 -->
  <g filter="url(#shadow)"><rect x="2413" y="270" width="486" height="864" fill="#f5efe4"/></g>
  <g clip-path="url(#p5)">
    <rect x="2413" y="270" width="486" height="864" fill="#f5efe4"/>
    <rect x="2413" y="270" width="486" height="22" fill="#234ddb"/>
    <text x="2452" y="455" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="94" font-weight="700" fill="#171511">TU</text>
    <text x="2452" y="548" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="94" font-weight="700" fill="#171511">VENTAJA</text>
    <text x="2452" y="618" font-family="Baskerville, Georgia, serif" font-size="58" font-style="italic" font-weight="700" fill="#234ddb">es algo propio.</text>
    <line x1="2452" y1="657" x2="2854" y2="657" stroke="#171511" stroke-width="8"/>
    <image x="2413" y="690" width="486" height="444" xlink:href="../assets-compartidos/presentador-03.jpg" preserveAspectRatio="xMidYMid slice"/>
    <rect x="2434" y="1037" width="444" height="75" fill="#f5efe4" opacity="0.95"/>
    <text x="2656" y="1085" text-anchor="middle" font-family="Avenir Next Condensed, Arial Narrow, sans-serif" font-size="29" font-weight="700" letter-spacing="2" fill="#171511">¿QUÉ TIENES TÚ QUE DECIR?</text>
  </g>

  <!-- Labels -->
  <g font-family="Courier New, monospace" font-size="22" font-weight="700" letter-spacing="2" fill="#171511">
    <text x="301" y="1200">01 — HOOK</text>
    <text x="829" y="1200">02 — ACELERACIÓN</text>
    <text x="1357" y="1200">03 — B-ROLL / CONTRASTE</text>
    <text x="1885" y="1200">04 — REMATE</text>
    <text x="2413" y="1200">05 — CIERRE</text>
  </g>
  <text x="301" y="1262" font-family="Avenir Next, Arial, sans-serif" font-size="24" fill="#171511">Sin tarjetas flotantes · sin esquinas redondeadas · sin neón · jerarquía por bloques editoriales, textura y contraste tipográfico.</text>
  <text x="2899" y="1320" text-anchor="end" font-family="Courier New, monospace" font-size="20" fill="#234ddb">PROPUESTA PARA APROBACIÓN · NO ES UN FRAME FINAL DE PRODUCCIÓN</text>
</svg>
