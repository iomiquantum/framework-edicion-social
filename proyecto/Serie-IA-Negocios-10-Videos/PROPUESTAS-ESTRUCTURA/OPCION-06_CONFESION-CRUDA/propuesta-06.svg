  <text x="301" y="1264" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#1d1818">Vulnerabilidad concreta: admitir, mostrar la consecuencia, entregar el aprendizaje e invitar una respuesta personal.</text><text x="2899" y="1322" text-anchor="end" font-family="Courier New, monospace" font-size="19" fill="#7a263a">PROPUESTA PARA APROBACIÓN · NO ES UN FRAME FINAL DE PRODUCCIÓN</text>
