    <text x="329" y="862" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#f0e1d0">Yo también pensé que</text><text x="329" y="930" font-family="Arial, sans-serif" font-size="51" font-weight="900" fill="#f0e1d0">PUBLICAR MÁS</text><text x="329" y="987" font-family="Arial, sans-serif" font-size="51" font-weight="900" fill="#f0e1d0">ERA AVANZAR.</text><line x1="329" y1="1017" x2="577" y2="1017" stroke="#7a263a" stroke-width="10"/><text x="329" y="1071" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#f0e1d0">No siempre lo era.</text>
