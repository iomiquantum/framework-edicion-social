    <text x="871" y="370" font-family="Georgia, serif" font-size="30" font-style="italic" fill="#7a263a">Mi regla era:</text><text x="871" y="475" font-family="Arial, sans-serif" font-size="53" font-weight="900" fill="#1d1818">MÁS POSTS</text><text x="871" y="543" font-family="Arial, sans-serif" font-size="53" font-weight="900" fill="#1d1818">= MÁS VALOR</text><line x1="860" y1="445" x2="1272" y2="570" stroke="#7a263a" stroke-width="13"/><line x1="1272" y1="445" x2="860" y2="570" stroke="#7a263a" stroke-width="13"/>
    <rect x="865" y="660" width="414" height="180" fill="#7a263a" transform="rotate(-1 865 660)"/><text x="1072" y="739" text-anchor="middle" font-family="Arial, sans-serif" font-size="50" font-weight="900" fill="#f0e1d0">ME</text><text x="1072" y="802" text-anchor="middle" font-family="Arial, sans-serif" font-size="50" font-weight="900" fill="#f0e1d0">EQUIVOQUÉ.</text>
    <text x="871" y="930" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#1d1818">La cantidad creció.</text><text x="871" y="980" font-family="Georgia, serif" font-size="28" font-style="italic" fill="#7a263a">Mi voz se estaba perdiendo.</text>
