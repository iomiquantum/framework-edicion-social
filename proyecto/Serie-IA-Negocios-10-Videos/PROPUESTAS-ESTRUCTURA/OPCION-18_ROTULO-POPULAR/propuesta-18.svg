  <svg x="829" y="270" width="486" height="864" viewBox="0 0 486 864" overflow="hidden"><rect width="486" height="864" fill="#f7f1da"/><rect x="27" y="26" width="432" height="812" rx="12" fill="none" stroke="#067f84" stroke-width="10"/><text x="243" y="106" text-anchor="middle" font-family="Arial" font-size="19" font-weight="900" letter-spacing="4" fill="#e94b35">HECHO A MANO</text><text x="243" y="223" text-anchor="middle" font-family="Arial Black" font-size="45" fill="#252239">TU OFICIO</text><text x="243" y="278" text-anchor="middle" font-family="Arial Black" font-size="45" fill="#252239">TAMBIÉN</text><text x="243" y="333" text-anchor="middle" font-family="Arial Black" font-size="45" fill="#067f84">CUENTA.</text><g fill="#f3c746" stroke="#252239" stroke-width="4"><circle cx="126" cy="477" r="69"/><circle cx="243" cy="550" r="69"/><circle cx="360" cy="477" r="69"/></g><g text-anchor="middle" font-family="Arial Black" font-size="20" fill="#252239"><text x="126" y="485">PRUEBA</text><text x="243" y="558">ERROR</text><text x="360" y="485">APRENDE</text></g><text x="243" y="713" text-anchor="middle" font-family="Georgia" font-size="30" font-style="italic" fill="#252239">Eso no lo copia</text><text x="243" y="757" text-anchor="middle" font-family="Georgia" font-size="30" font-style="italic" fill="#e94b35">ninguna fórmula.</text></svg>
<rect x="1357" y="270" width="486" height="864" fill="#e94b35" filter="url(#shadow)"/>
  <svg x="1357" y="270" width="486" height="864" viewBox="0 0 486 864" overflow="hidden"><image x="0" y="0" width="486" height="864" xlink:href="../assets-compartidos/video-11-collage.png" preserveAspectRatio="xMidYMid slice"/><rect width="486" height="864" fill="#e94b35" opacity=".18"/><rect x="24" y="27" width="438" height="148" fill="#f3c746"/><text x="243" y="87" text-anchor="middle" font-family="Arial Black" font-size="33" fill="#252239">MEZCLA LO QUE SABES</text><text x="243" y="132" text-anchor="middle" font-family="Arial Black" font-size="33" fill="#067f84">CON LO QUE VIVISTE.</text><path d="M22 647 L464 582 V837 L22 837Z" fill="#252239"/><text x="243" y="690" text-anchor="middle" font-family="Georgia" font-size="28" font-style="italic" fill="#f7f1da">Ahí aparece una forma</text><text x="243" y="736" text-anchor="middle" font-family="Georgia" font-size="28" font-style="italic" fill="#f7f1da">que solo puede ser tuya.</text><text x="243" y="795" text-anchor="middle" font-family="Arial Black" font-size="29" fill="#f3c746">MEZCLA. NO IMITES.</text></svg>
<rect x="1885" y="270" width="486" height="864" fill="#f3c746" filter="url(#shadow)"/>
  <svg x="1885" y="270" width="486" height="864" viewBox="0 0 486 864" overflow="hidden"><image x="0" y="0" width="486" height="864" xlink:href="../assets-compartidos/presentador-02.jpg" preserveAspectRatio="xMidYMid slice"/><rect width="486" height="864" fill="#f3c746" opacity=".07"/><path d="M0 0H486V166L0 211Z" fill="#067f84"/><text x="36" y="69" font-family="Arial Black" font-size="31" fill="#f7f1da">QUE SUENE</text><text x="36" y="111" font-family="Arial Black" font-size="31" fill="#f3c746">COMO HABLAS.</text><rect x="31" y="711" width="424" height="124" fill="#f7f1da" stroke="#252239" stroke-width="6"/><text x="243" y="764" text-anchor="middle" font-family="Georgia" font-size="29" font-style="italic" fill="#252239">Tu acento, tus ejemplos,</text><text x="243" y="806" text-anchor="middle" font-family="Arial Black" font-size="27" fill="#e94b35">TU MANERA DE EXPLICAR.</text></svg>
<rect x="2413" y="270" width="486" height="864" fill="#252239" filter="url(#shadow)"/>
  <svg x="2413" y="270" width="486" height="864" viewBox="0 0 486 864" overflow="hidden"><rect width="486" height="864" fill="#252239"/><rect x="30" y="31" width="426" height="802" fill="url(#tiles)"/><rect x="58" y="66" width="370" height="694" fill="#f7f1da" stroke="#067f84" stroke-width="8"/><text x="243" y="182" text-anchor="middle" font-family="Arial Black" font-size="39" fill="#252239">TU FIRMA</text><text x="243" y="234" text-anchor="middle" font-family="Arial Black" font-size="34" fill="#e94b35">NO ES UN LOGO.</text><path d="M96 317 H390" stroke="#f3c746" stroke-width="11"/><text x="243" y="432" text-anchor="middle" font-family="Georgia" font-size="35" font-style="italic" fill="#252239">Es la forma</text><text x="243" y="482" text-anchor="middle" font-family="Georgia" font-size="35" font-style="italic" fill="#252239">en que cuentas</text><text x="243" y="532" text-anchor="middle" font-family="Georgia" font-size="35" font-style="italic" fill="#252239">lo que viviste.</text><rect x="87" y="635" width="312" height="77" fill="#067f84"/><text x="243" y="683" text-anchor="middle" font-family="Arial Black" font-size="25" fill="#f7f1da">¿CUÁL ES LA TUYA?</text></svg>
