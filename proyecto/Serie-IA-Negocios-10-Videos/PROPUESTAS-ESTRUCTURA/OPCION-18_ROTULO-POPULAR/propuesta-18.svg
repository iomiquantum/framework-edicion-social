  <svg x="301" y="270" width="486" height="864" viewBox="0 0 486 864" overflow="hidden"><rect width="486" height="864" fill="#067f84"/><path d="M0 0H486V218L0 303Z" fill="#f3c746"/><path d="M0 700L486 596V864H0Z" fill="#e94b35"/><text x="39" y="91" font-family="Arial Black" font-size="38" fill="#252239">PONLE CALLE</text><text x="39" y="140" font-family="Arial Black" font-size="38" fill="#252239">A TU IDEA.</text><text x="243" y="398" text-anchor="middle" font-family="Georgia" font-size="34" font-style="italic" fill="#f7f1da">Que se sienta vivida.</text><text x="243" y="453" text-anchor="middle" font-family="Georgia" font-size="34" font-style="italic" fill="#f7f1da">Que tenga una historia.</text><rect x="47" y="535" width="392" height="111" fill="#f7f1da" transform="rotate(-3 243 590)"/><text x="243" y="585" text-anchor="middle" font-family="Arial Black" font-size="29" fill="#252239">QUE NO PAREZCA</text><text x="243" y="625" text-anchor="middle" font-family="Arial Black" font-size="29" fill="#e94b35">HECHA EN SERIE.</text></svg>
